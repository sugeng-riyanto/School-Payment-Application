{% extends 'base.html' %}
{% block title %}Edit Uang Kegiatan{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white rounded-xl shadow-md p-6">
        <h1 class="text-2xl font-bold mb-4">Edit Uang Kegiatan</h1>
        <form method="post">
            {% csrf_token %}
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Siswa</label>
                <select name="student" class="w-full border rounded-lg p-2 bg-gray-100" disabled>
                    <option value="{{ dpp.student.id }}">{{ dpp.student.full_name }}</option>
                </select>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Jumlah</label>
                <input type="number" name="amount" value="{{ dpp.amount|floatformat:0 }}" class="w-full border rounded-lg p-2" required>
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Keterangan</label>
                <textarea name="description" class="w-full border rounded-lg p-2" rows="3">{{ dpp.description }}</textarea>
            </div>
            <div class="flex gap-2">
                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700"><i class="fas fa-save mr-1"></i>Simpan</button>
                <a href="{% url 'finance:kegiatan_list' %}" class="bg-gray-500 text-white px-4 py-2 rounded-lg hover:bg-gray-600"><i class="fas fa-times mr-1"></i>Batal</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
