{% extends 'base.html' %}
{% block title %}Tambah Tarif SPP{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6">Tambah Tarif SPP</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tahun Ajaran</label>
                <select name="academic_year" required class="w-full px-4 py-2 border rounded-lg">
                    {% for y in years %}
                    <option value="{{ y.id }}">{{ y.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Jenjang / Kelas</label>
                <select name="grade" required class="w-full px-4 py-2 border rounded-lg">
                    {% for g in grades %}
                    <option value="{{ g.id }}">{{ g.get_level_display }} - {{ g.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nominal (Rp)</label>
                <input type="number" name="amount" required class="w-full px-4 py-2 border rounded-lg">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                <i class="fas fa-save mr-2"></i>Simpan
            </button>
            <a href="{% url 'finance:spp_list' %}" class="block text-center text-gray-600 hover:text-gray-800 mt-2">Batal</a>
        </form>
    </div>
</div>
{% endblock %}
