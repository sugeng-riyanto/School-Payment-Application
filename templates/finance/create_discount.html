{% extends 'base.html' %}
{% block title %}Buat Diskon{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6">Buat Diskon Pembayaran</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Siswa</label>
                <select name="student" required class="w-full px-4 py-2 border rounded-lg">
                    {% for s in students %}
                    <option value="{{ s.nisn }}">{{ s.full_name }} ({{ s.nisn }})</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tipe Pembayaran</label>
                <select name="discount_type" required class="w-full px-4 py-2 border rounded-lg">
                    <option value="spp">SPP</option>
                    <option value="dpp">DPP</option>
                    <option value="eca">ECA</option>
                    <option value="kegiatan">Uang Kegiatan</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Jumlah Diskon (Rp)</label>
                <input type="number" name="amount" required class="w-full px-4 py-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Keterangan</label>
                <textarea name="description" rows="2" class="w-full px-4 py-2 border rounded-lg"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Berlaku Sampai (opsional)</label>
                <input type="date" name="valid_until" class="w-full px-4 py-2 border rounded-lg">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                <i class="fas fa-save mr-2"></i>Simpan Diskon
            </button>
        </form>
    </div>
</div>
{% endblock %}
