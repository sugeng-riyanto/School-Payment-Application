{% extends 'base.html' %}
{% block title %}Buat DPP{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6">Buat DPP Pembangunan / Uang Kegiatan</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Siswa</label>
                <select name="student" required class="w-full px-4 py-2 border rounded-lg">
                    {% for s in students %}
                    <option value="{{ s.nisn }}">{{ s.full_name }} ({{ s.nisn }}) - {{ s.class_grade }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Kategori</label>
                <select name="category" required class="w-full px-4 py-2 border rounded-lg">
                    <option value="pembangunan">DPP Pembangunan</option>
                    <option value="kegiatan">Uang Kegiatan</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Jumlah (Rp)</label>
                <input type="number" name="amount" required class="w-full px-4 py-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Keterangan</label>
                <textarea name="description" rows="3" class="w-full px-4 py-2 border rounded-lg"></textarea>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                <i class="fas fa-save mr-2"></i>Simpan
            </button>
        </form>
    </div>
</div>
{% endblock %}
