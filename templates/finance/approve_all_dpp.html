{% extends 'base.html' %}
{% block title %}Setujui Semua DPP{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-2">Setujui Semua DPP</h1>
        <p class="text-gray-600 mb-6">{{ count }} DPP menunggu persetujuan.</p>
        <form method="post" enctype="multipart/form-data" class="space-y-4">
            <p class="text-sm text-gray-500">Upload file XLSX berisi daftar NIS siswa yang akan disetujui DPP-nya.</p>
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">File XLSX (kolom A: NIS)</label>
                <input type="file" name="payment_proof" accept=".xlsx,.xls" required class="w-full px-4 py-2 border rounded-lg">
            </div>
            <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700">
                <i class="fas fa-check-double mr-2"></i>Setujui Semua
            </button>
            <a href="{% url 'finance:dpp_list' %}" class="block text-center text-gray-600 hover:underline mt-2">Batal</a>
        </form>
    </div>
</div>
{% endblock %}
