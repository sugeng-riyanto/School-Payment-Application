{% extends 'base.html' %}
{% block title %}Import Kompensasi{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6">Import Kompensasi dari XLSX</h1>
        <div class="mb-4 p-3 bg-blue-50 text-blue-800 rounded text-sm">
            <strong>Format:</strong> NIS, Tipe (spp/dpp/eca/kegiatan/other), Deskripsi, Jumlah Asli, Jumlah Potongan
        </div>
        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            <input type="file" name="file" accept=".xlsx,.xls" required class="w-full px-4 py-2 border rounded-lg">
            <button type="submit" class="w-full bg-purple-600 text-white py-2 rounded-lg hover:bg-purple-700">
                <i class="fas fa-upload mr-2"></i>Import
            </button>
        </form>
    </div>
</div>
{% endblock %}
