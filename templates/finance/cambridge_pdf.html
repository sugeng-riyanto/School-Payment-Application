<!DOCTYPE html><html><head><meta charset="utf-8"><title>Cambridge Assessment</title>
<style>body{font-family:DejaVu Sans;font-size:10px;}table{width:100%;border-collapse:collapse;}th,td{border:1px solid #ddd;padding:4px;text-align:left;}th{background:#f5f5f5;}</style>
</head><body><h2>Laporan Cambridge Assessment</h2>
<table><thead><tr><th>NISN</th><th>Nama</th><th>Kelas</th><th>Exam</th><th>Subject</th><th>Nominal</th><th>Status</th></tr></thead>
<tbody>{% for e in exams %}<tr><td>{{ e.student.nisn }}</td><td>{{ e.student.full_name }}</td><td>{{ e.student.class_grade }}</td><td>{{ e.get_exam_type_display }}</td><td>{{ e.subject }}</td><td>Rp{{ e.amount|floatformat:0 }}</td><td>{{ e.is_paid|yesno:"Lunas,Belum" }}</td></tr>{% endfor %}</tbody>
</table></body></html>
