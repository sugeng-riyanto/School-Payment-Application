{% extends 'base.html' %}
{% block title %}Kirim Peringatan{% endblock %}
{% block content %}
<div class="max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-2xl font-bold">Peringatan Pembayaran</h1>
        <div class="flex gap-2">
            <a href="{% url 'reports:export_reminder_xlsx' %}" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 text-sm"><i class="fas fa-file-excel mr-1"></i>XLSX</a>
            <a href="{% url 'reports:export_reminder_pdf' %}" class="bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 text-sm"><i class="fas fa-file-pdf mr-1"></i>PDF</a>
            <a href="{% url 'finance:reminder_list' %}" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 text-sm"><i class="fas fa-list mr-1"></i>Semua Peringatan</a>
        </div>
    </div>
    <div class="bg-white p-8 rounded-xl shadow-md max-w-lg mx-auto">
        <h1 class="text-2xl font-bold mb-6">Kirim Peringatan Pembayaran</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Jenis Peringatan</label>
                <select name="reminder_type" required class="w-full px-4 py-2 border rounded-lg">
                    <option value="1">Peringatan Pertama</option>
                    <option value="2">Peringatan Kedua</option>
                    <option value="3">Peringatan Ketiga</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Bulan Tagihan</label>
                <select name="month" required class="w-full px-4 py-2 border rounded-lg">
                    {% for m in months %}
                    <option value="{{ m.0 }}">{{ m.1 }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tahun</label>
                <input type="number" name="year" value="2025" required class="w-full px-4 py-2 border rounded-lg">
            </div>
            <button type="submit" class="w-full bg-red-600 text-white py-2 rounded-lg hover:bg-red-700">
                <i class="fas fa-bell mr-2"></i>Kirim Peringatan
            </button>
        </form>
    </div>
</div>
{% endblock %}
