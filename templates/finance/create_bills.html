{% extends 'base.html' %}
{% block title %}Buat Tagihan SPP{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6">Buat Tagihan SPP Massal</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Bulan</label>
                <select name="month" required class="w-full px-4 py-2 border rounded-lg">
                    {% for m in months %}
                    <option value="{{ m.0 }}">{{ m.1 }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tahun</label>
                <input type="number" name="year" value="2025" required class="w-full px-4 py-2 border rounded-lg">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                <i class="fas fa-plus mr-2"></i>Buat Tagihan
            </button>
        </form>
    </div>
</div>
{% endblock %}
