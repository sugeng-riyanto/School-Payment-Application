{% extends 'base.html' %}
{% block title %}Edit Tagihan SPP{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6">Edit Tagihan SPP</h1>
        <div class="mb-4 p-4 bg-gray-50 rounded-lg">
            <p><strong>Siswa:</strong> {{ bill.student.full_name }}</p>
            <p><strong>Bulan:</strong> {{ bill.get_month_display }} {{ bill.year }}</p>
        </div>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Jumlah (Rp)</label>
                <input type="number" name="amount" value="{{ bill.amount }}" required class="w-full px-4 py-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Virtual Account</label>
                <input type="text" name="virtual_account" value="{{ bill.virtual_account }}" class="w-full px-4 py-2 border rounded-lg">
            </div>
            <div class="flex items-center">
                <input type="checkbox" name="is_paid" id="is_paid" {% if bill.is_paid %}checked{% endif %} class="mr-2">
                <label for="is_paid" class="text-sm font-medium text-gray-700">Lunas</label>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                <i class="fas fa-save mr-2"></i>Update
            </button>
            <a href="{% url 'finance:spp_bill_list' %}" class="block text-center text-gray-600 hover:text-gray-800 mt-2">Batal</a>
        </form>
    </div>
</div>
{% endblock %}
