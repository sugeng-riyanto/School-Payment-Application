{% extends 'base.html' %}
{% block title %}Edit Tarif SPP{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6">Edit Tarif SPP</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Jenjang</label>
                <input type="text" value="{{ spp.grade }}" readonly class="w-full px-4 py-2 border rounded-lg bg-gray-100">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tahun Ajaran</label>
                <input type="text" value="{{ spp.academic_year }}" readonly class="w-full px-4 py-2 border rounded-lg bg-gray-100">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nominal (Rp)</label>
                <input type="number" name="amount" value="{{ spp.amount }}" required class="w-full px-4 py-2 border rounded-lg">
            </div>
            <div class="flex items-center">
                <input type="checkbox" name="is_active" id="is_active" {% if spp.is_active %}checked{% endif %} class="mr-2">
                <label for="is_active" class="text-sm font-medium text-gray-700">Aktif</label>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                <i class="fas fa-save mr-2"></i>Update
            </button>
            <a href="{% url 'finance:spp_list' %}" class="block text-center text-gray-600 hover:text-gray-800 mt-2">Batal</a>
        </form>
    </div>
</div>
{% endblock %}
