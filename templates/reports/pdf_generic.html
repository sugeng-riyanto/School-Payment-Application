<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
    body { font-family: Helvetica, Arial, sans-serif; font-size: 11px; }
    h1 { text-align: center; font-size: 18px; margin-bottom: 20px; }
    table { width: 100%; border-collapse: collapse; }
    th { background-color: #f0f0f0; border: 1px solid #333; padding: 6px; text-align: left; font-size: 10px; }
    td { border: 1px solid #999; padding: 5px; font-size: 10px; }
</style>
</head>
<body>
    <h1>{{ title }}</h1>
    <table>
        <tr>{% for h in headers %}<th>{{ h }}</th>{% endfor %}</tr>
        {% for row in rows %}
        <tr>{% for val in row.values %}<td>{{ val }}</td>{% endfor %}</tr>
        {% endfor %}
    </table>
</body>
</html>
