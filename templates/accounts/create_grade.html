{% extends 'base.html' %}
{% block title %}Tambah Jenjang{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6">Tambah Jenjang Baru</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nama Jenjang</label>
                <input type="text" name="name" required class="w-full px-4 py-2 border rounded-lg" placeholder="Contoh: Kelas 1, Kelas 7">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Level</label>
                <select name="level" required class="w-full px-4 py-2 border rounded-lg">
                    <option value="sd">SD</option>
                    <option value="smp">SMP</option>
                    <option value="sma">SMA</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Simpan</button>
        </form>
    </div>
</div>
{% endblock %}
