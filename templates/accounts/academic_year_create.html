{% extends 'base.html' %}
{% block title %}{% if year %}Edit{% else %}Tambah{% endif %} Tahun Ajaran{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6">{% if year %}Edit{% else %}Tambah{% endif %} Tahun Ajaran</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium mb-1">Nama Tahun Ajaran</label>
                <input type="text" name="name" value="{{ year.name|default:'' }}" required class="w-full border rounded-lg p-2" placeholder="contoh: 2026/2027">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Tanggal Mulai</label>
                <input type="date" name="start_date" value="{{ year.start_date|date:'Y-m-d'|default:'' }}" required class="w-full border rounded-lg p-2">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Tanggal Selesai</label>
                <input type="date" name="end_date" value="{{ year.end_date|date:'Y-m-d'|default:'' }}" required class="w-full border rounded-lg p-2">
            </div>
            <div class="flex items-center gap-2">
                <input type="checkbox" name="is_active" id="is_active" {% if year.is_active %}checked{% endif %} class="w-4 h-4">
                <label for="is_active" class="text-sm font-medium">Jadikan aktif</label>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700"><i class="fas fa-save mr-2"></i>Simpan</button>
        </form>
    </div>
</div>
{% endblock %}
