{% extends 'base.html' %}
{% block title %}Tambah Kelas{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6">Tambah Kelas Baru</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nama Kelas</label>
                <input type="text" name="name" required class="w-full px-4 py-2 border rounded-lg" placeholder="Contoh: A, B, IPA 1">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Jenjang</label>
                <select name="grade" required class="w-full px-4 py-2 border rounded-lg">
                    {% for g in grades %}
                    <option value="{{ g.id }}">{{ g }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tahun Ajaran</label>
                <select name="academic_year" required class="w-full px-4 py-2 border rounded-lg">
                    {% for y in academic_years %}
                    <option value="{{ y.id }}">{{ y.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Simpan</button>
        </form>
    </div>
</div>
{% endblock %}
