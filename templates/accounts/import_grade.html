{% extends 'base.html' %}
{% block title %}Import Jenjang{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6">Import Jenjang dari XLSX</h1>
        <div class="mb-4 p-4 bg-blue-50 rounded-lg text-sm">
            <p>Format: <strong>Nama Jenjang</strong>, <strong>Level</strong> (sd/smp/sma)</p>
        </div>
        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            <input type="file" name="file" accept=".xlsx,.xls" required class="w-full px-4 py-2 border rounded-lg">
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700"><i class="fas fa-upload mr-2"></i>Import</button>
        </form>
    </div>
</div>
{% endblock %}
