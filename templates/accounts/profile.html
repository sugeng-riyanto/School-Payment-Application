{% extends 'base.html' %}
{% block title %}Profil{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white p-8 rounded-xl shadow-md">
        <div class="text-center mb-6">
            {% if profile_user.avatar %}
            <img src="{{ profile_user.avatar.url }}" class="w-24 h-24 rounded-full mx-auto mb-4 object-cover">
            {% else %}
            <div class="w-24 h-24 rounded-full bg-blue-100 mx-auto mb-4 flex items-center justify-center">
                <i class="fas fa-user text-3xl text-blue-500"></i>
            </div>
            {% endif %}
            <h1 class="text-xl font-bold">{{ profile_user.get_full_name|default:profile_user.username }}</h1>
            <span class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm">{{ profile_user.get_role_display }}</span>
        </div>

        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium mb-1">Username</label>
                <input type="text" value="{{ profile_user.username }}" disabled class="w-full px-4 py-2 border rounded-lg bg-gray-100">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Nama Depan</label>
                <input type="text" name="first_name" value="{{ profile_user.first_name|default:'' }}" class="w-full px-4 py-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Nama Belakang</label>
                <input type="text" name="last_name" value="{{ profile_user.last_name|default:'' }}" class="w-full px-4 py-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Email <span class="text-red-500">*</span></label>
                <input type="email" name="email" value="{{ profile_user.email|default:'' }}" required class="w-full px-4 py-2 border rounded-lg" placeholder="wajib diisi">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Nomor HP</label>
                <input type="text" name="phone" value="{{ profile_user.phone|default:'' }}" class="w-full px-4 py-2 border rounded-lg" placeholder="08xxxxxxxxxx">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Alamat</label>
                <textarea name="alamat" rows="2" class="w-full px-4 py-2 border rounded-lg">{{ profile_user.alamat|default:'' }}</textarea>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Foto Profil</label>
                <input type="file" name="avatar" accept="image/*" class="w-full px-4 py-2 border rounded-lg">
            </div>
            <hr>
            <h3 class="font-semibold">Ganti Password (opsional)</h3>
            <div>
                <label class="block text-sm font-medium mb-1">Password Baru</label>
                <input type="password" name="password1" class="w-full px-4 py-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Konfirmasi Password Baru</label>
                <input type="password" name="password2" class="w-full px-4 py-2 border rounded-lg">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">Simpan</button>
        </form>
    </div>
</div>
{% endblock %}
