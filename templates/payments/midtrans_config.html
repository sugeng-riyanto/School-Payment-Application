{% extends 'base.html' %}
{% block title %}Konfigurasi Midtrans{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6">Konfigurasi Midtrans</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Merchant ID</label>
                <input type="text" name="merchant_id" value="{{ config.merchant_id }}" class="w-full px-4 py-2 border rounded-lg font-mono">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Client Key</label>
                <div class="flex gap-2">
                    <input type="password" name="client_key" id="clientKey" value="{{ config.client_key }}" class="flex-1 px-4 py-2 border rounded-lg font-mono">
                    <button type="button" onclick="toggleField('clientKey')" class="px-3 py-2 bg-gray-200 rounded-lg hover:bg-gray-300"><i class="fas fa-eye"></i></button>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Server Key</label>
                <div class="flex gap-2">
                    <input type="password" name="server_key" id="serverKey" value="{{ config.server_key }}" class="flex-1 px-4 py-2 border rounded-lg font-mono">
                    <button type="button" onclick="toggleField('serverKey')" class="px-3 py-2 bg-gray-200 rounded-lg hover:bg-gray-300"><i class="fas fa-eye"></i></button>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <input type="checkbox" name="is_production" id="isProduction" {% if config.is_production %}checked{% endif %} class="rounded border-gray-300">
                <label for="isProduction" class="text-sm text-gray-700">Production Mode</label>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                <i class="fas fa-save mr-2"></i>Simpan Konfigurasi
            </button>
        </form>
        <div class="mt-6 pt-4 border-t">
            <p class="text-sm text-gray-500 mb-3">Gagal membuat transaksi? Cek koneksi ke server Midtrans.</p>
            <a href="{% url 'payments:test_midtrans' %}" class="w-full block text-center bg-gray-800 text-white py-2 rounded-lg hover:bg-gray-900" onclick="return confirm('Test koneksi Midtrans dengan konfigurasi saat ini?')">
                <i class="fas fa-plug mr-2"></i>Test Koneksi
            </a>
        </div>
    </div>
</div>
<script>
function toggleField(id) {
    const el = document.getElementById(id);
    el.type = el.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
