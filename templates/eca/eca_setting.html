{% extends 'base.html' %}
{% block title %}Pengaturan ECA{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6">Pengaturan ECA</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Maksimal ECA per Siswa</label>
                <input type="number" name="max_selection" value="{{ setting.max_selection }}" min="1" required class="w-full px-4 py-2 border rounded-lg">
                <p class="text-xs text-gray-500 mt-1">Jumlah maksimal program ECA yang bisa diikuti setiap siswa</p>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                <i class="fas fa-save mr-2"></i>Simpan Pengaturan
            </button>
        </form>
    </div>
</div>
{% endblock %}
