{% extends 'base.html' %}
{% block title %}Download Laporan ECA{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6">Download Laporan ECA</h1>
        <div class="space-y-4">
            <a href="{% url 'reports:export_eca_xlsx' %}" class="flex items-center p-4 bg-green-50 rounded-lg hover:bg-green-100">
                <i class="fas fa-file-excel text-2xl text-green-600 mr-4"></i>
                <div><p class="font-medium">Format XLSX</p><p class="text-sm text-gray-500">Excel spreadsheet</p></div>
            </a>
            <a href="{% url 'reports:export_eca_pdf' %}" class="flex items-center p-4 bg-red-50 rounded-lg hover:bg-red-100">
                <i class="fas fa-file-pdf text-2xl text-red-600 mr-4"></i>
                <div><p class="font-medium">Format PDF</p><p class="text-sm text-gray-500">Portable Document Format</p></div>
            </a>
        </div>
    </div>
</div>
{% endblock %}
