{% extends 'base.html' %}
{% block title %}Edit Jenis ECA{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <div class="bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6">Edit Jenis ECA</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nama Jenis ECA</label>
                <input type="text" name="name" value="{{ type_obj.name }}" required class="w-full px-4 py-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Deskripsi</label>
                <textarea name="description" rows="3" class="w-full px-4 py-2 border rounded-lg">{{ type_obj.description }}</textarea>
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                <i class="fas fa-save mr-2"></i>Update
            </button>
            <a href="{% url 'eca:type_list' %}" class="block text-center text-gray-600 hover:text-gray-800 mt-2">Batal</a>
        </form>
    </div>
</div>
{% endblock %}
