{% extends 'base.html' %}
{% block title %}{% if edit_mode %}Edit Program ECA{% else %}Buat Program ECA{% endif %}{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6">{% if edit_mode %}Edit Program ECA{% else %}Buat Program ECA Baru{% endif %}</h1>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Jenis ECA</label>
                    <select name="eca_type" required class="w-full px-4 py-2 border rounded-lg">
                        {% for t in types %}
                        <option value="{{ t.id }}" {% if edit_mode and program.eca_type_id == t.id %}selected{% endif %}>{{ t.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Jenjang</label>
                    <select name="grade" required class="w-full px-4 py-2 border rounded-lg">
                        {% for g in grades %}
                        <option value="{{ g.id }}" {% if edit_mode and program.grade_id == g.id %}selected{% endif %}>{{ g }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nama Program</label>
                <input type="text" name="name" required class="w-full px-4 py-2 border rounded-lg" value="{{ program.name|default:'' }}">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Deskripsi</label>
                <textarea name="description" rows="3" class="w-full px-4 py-2 border rounded-lg">{{ program.description|default:'' }}</textarea>
            </div>
            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Harga (Rp)</label>
                    <input type="number" name="price" required class="w-full px-4 py-2 border rounded-lg" value="{{ program.price|default:'' }}">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Durasi</label>
                    <select name="duration" required class="w-full px-4 py-2 border rounded-lg">
                        <option value="1month" {% if edit_mode and program.duration == '1month' %}selected{% endif %}>1 Bulan</option>
                        <option value="3months" {% if edit_mode and program.duration == '3months' %}selected{% endif %}>3 Bulan</option>
                        <option value="6months" {% if edit_mode and program.duration == '6months' %}selected{% endif %}>6 Bulan</option>
                        <option value="1year" {% if edit_mode and program.duration == '1year' %}selected{% endif %}>1 Tahun</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Max Peserta</label>
                    <input type="number" name="max_participants" value="{{ program.max_participants|default:'0' }}" class="w-full px-4 py-2 border rounded-lg">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Jadwal Kegiatan 1</label>
                <input type="text" name="schedule" placeholder="Contoh: Senin 15:00-16:30" class="w-full px-4 py-2 border rounded-lg" value="{{ program.schedule|default:'' }}">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Jadwal Kegiatan 2</label>
                <input type="text" name="schedule2" placeholder="Contoh: Rabu 15:00-16:30" class="w-full px-4 py-2 border rounded-lg" value="{{ program.schedule2|default:'' }}">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Penanggung Jawab / Pelatih</label>
                <input type="text" name="pic" class="w-full px-4 py-2 border rounded-lg" value="{{ program.pic|default:'' }}">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Profil Pelatih / Instruktur</label>
                <textarea name="coach_profile" rows="2" class="w-full px-4 py-2 border rounded-lg" placeholder="Latar belakang, pengalaman, sertifikasi pelatih...">{{ program.coach_profile|default:'' }}</textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Lokasi Kegiatan</label>
                <input type="text" name="location" class="w-full px-4 py-2 border rounded-lg" value="{{ program.location|default:'' }}" placeholder="Ruangan / lapangan / gedung...">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Link Meeting (untuk ECA Online)</label>
                <input type="url" name="meeting_link" class="w-full px-4 py-2 border rounded-lg" value="{{ program.meeting_link|default:'' }}" placeholder="https://meet.google.com/...">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ketentuan & Tata Tertib</label>
                <textarea name="rules" rows="3" class="w-full px-4 py-2 border rounded-lg" placeholder="Aturan berpakaian, kehadiran, sanksi...">{{ program.rules|default:'' }}</textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Informasi Penting Lainnya</label>
                <textarea name="additional_info" rows="3" class="w-full px-4 py-2 border rounded-lg" placeholder="Persyaratan khusus, perlengkapan, biaya tambahan...">{{ program.additional_info|default:'' }}</textarea>
            </div>
            {% if edit_mode %}
            <div class="flex items-center gap-2">
                <input type="checkbox" name="is_open" id="is_open" {% if program.is_open %}checked{% endif %} class="rounded border-gray-300">
                <label for="is_open" class="text-sm text-gray-700">Program Aktif / Buka Pendaftaran</label>
            </div>
            {% endif %}
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
                <i class="fas fa-save mr-2"></i>{% if edit_mode %}Update Program{% else %}Simpan Program{% endif %}
            </button>
        </form>
    </div>
</div>
{% endblock %}
