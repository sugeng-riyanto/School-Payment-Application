{% extends 'base.html' %}
{% block title %}Import Jenis ECA{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white p-8 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-6">Import Jenis ECA dari XLSX</h1>
        <div class="mb-6 p-4 bg-blue-50 rounded-lg text-sm">
            <p class="font-medium mb-2">Format file XLSX (kolom urut):</p>
            <ol class="list-decimal list-inside space-y-1 text-gray-600">
                <li><strong>Nama Jenis</strong></li>
                <li><strong>Deskripsi</strong> (opsional)</li>
            </ol>
        </div>
        <div class="mb-4">
            <a href="{% url 'accounts:download_template' 'eca_types' %}" class="inline-block bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 text-sm">
                <i class="fas fa-download mr-1"></i>Download Template XLSX
            </a>
        </div>
        <form method="post" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            <input type="file" name="file" accept=".xlsx,.xls" required class="w-full px-4 py-2 border rounded-lg">
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700"><i class="fas fa-upload mr-2"></i>Import</button>
        </form>
    </div>
</div>
{% endblock %}
